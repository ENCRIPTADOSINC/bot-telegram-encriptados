<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Simulador de traducción</title>
  <style>
    :root {
      --bg: #eef1f5;
      --panel: #ffffff;
      --chat-bg: #dfe7ef;
      --text: #1b2430;
      --muted: #6b7684;
      --border: #d5dce4;
      --out: #e1f7cb;
      --in: #ffffff;
      --accent: #2a8ad6;
      --error: #c0392b;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f141a;
        --panel: #17202a;
        --chat-bg: #0e1621;
        --text: #e6edf3;
        --muted: #8b98a7;
        --border: #263241;
        --out: #2b5278;
        --in: #182533;
        --accent: #5aa9e6;
        --error: #ff7b6b;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px 24px;
      padding: 12px 16px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }
    header h1 { font-size: 16px; margin: 0; }
    header .meta { font-size: 13px; color: var(--muted); }
    header label { font-size: 13px; display: flex; align-items: center; gap: 8px; }
    select, button, textarea { font: inherit; color: inherit; }
    select {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 8px;
    }
    .scenario { margin-left: auto; }
    .play {
      border: none;
      border-radius: 6px;
      padding: 5px 12px;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
    .play:disabled { opacity: 0.5; cursor: default; }
    .reset {
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 12px;
      cursor: pointer;
    }
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      background: var(--border);
      min-height: 0;
    }
    @media (max-width: 760px) {
      main { grid-template-columns: 1fr; grid-auto-rows: minmax(0, 1fr); }
    }
    .chat { display: flex; flex-direction: column; min-height: 0; background: var(--chat-bg); }
    .chat-head {
      padding: 10px 16px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }
    .chat-head strong { display: block; font-size: 15px; }
    .chat-head span { font-size: 12px; color: var(--muted); }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .msg {
      max-width: 80%;
      padding: 8px 12px;
      border-radius: 12px;
      line-height: 1.4;
      white-space: pre-wrap;
      word-wrap: break-word;
      box-shadow: 0 1px 1px rgb(0 0 0 / 0.08);
    }
    .msg.out { align-self: flex-end; background: var(--out); border-bottom-right-radius: 4px; }
    .msg.in { align-self: flex-start; background: var(--in); border-bottom-left-radius: 4px; }
    .msg .info { display: block; margin-top: 4px; font-size: 11px; color: var(--muted); }
    .msg details { margin-top: 4px; font-size: 12px; color: var(--muted); }
    .msg details summary { cursor: pointer; }
    .msg.pending { opacity: 0.6; font-style: italic; }
    .msg.error { color: var(--error); }
    form {
      display: flex;
      gap: 8px;
      padding: 10px 12px;
      background: var(--panel);
      border-top: 1px solid var(--border);
    }
    textarea {
      flex: 1;
      resize: none;
      height: 42px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg);
      scrollbar-width: none;
    }
    form button {
      border: none;
      border-radius: 10px;
      padding: 0 16px;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <h1>Simulador de traducción</h1>
    <label>
      Idioma del cliente
      <select id="client-lang">
        <option value="auto">Detectar automáticamente</option>
        <option value="en">Inglés</option>
        <option value="pt">Portugués</option>
        <option value="fr">Francés</option>
        <option value="de">Alemán</option>
        <option value="it">Italiano</option>
        <option value="ru">Ruso</option>
        <option value="zh">Chino</option>
        <option value="ar">Árabe</option>
      </select>
    </label>
    <span class="meta" id="status">Idioma detectado: —</span>
    <label class="scenario">
      Escenario
      <select id="scenario"><option value="">Elige una conversación…</option></select>
    </label>
    <button class="play" id="play" type="button">▶ Reproducir</button>
    <button class="reset" id="reset" type="button">Limpiar chats</button>
  </header>

  <main>
    <section class="chat">
      <div class="chat-head">
        <strong>Cliente</strong>
        <span>Escribe en cualquier idioma</span>
      </div>
      <div class="messages" id="client-messages"></div>
      <form id="client-form">
        <textarea id="client-input" placeholder="Hello, I need help with my order…"></textarea>
        <button type="submit">Enviar</button>
      </form>
    </section>

    <section class="chat">
      <div class="chat-head">
        <strong>Tú (Encriptados)</strong>
        <span id="owner-sub">Lees y escribes en español</span>
      </div>
      <div class="messages" id="owner-messages"></div>
      <form id="owner-form">
        <textarea id="owner-input" placeholder="Hola, claro que sí, ¿cuál es tu número de pedido?"></textarea>
        <button type="submit">Enviar</button>
      </form>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const state = { ownerLanguage: "es", detectedClientLanguage: null };

    fetch("/api/config")
      .then((r) => r.json())
      .then((cfg) => {
        state.ownerLanguage = cfg.ownerLanguage;
        $("owner-sub").textContent = `Lees y escribes en «${cfg.ownerLanguage}» · ${cfg.model}`;
      });

    function clientLanguage() {
      const chosen = $("client-lang").value;
      if (chosen !== "auto") return chosen;
      return state.detectedClientLanguage || "en";
    }

    function addBubble(container, cls, text) {
      const el = document.createElement("div");
      el.className = `msg ${cls}`;
      el.textContent = text;
      $(container).appendChild(el);
      $(container).scrollTop = $(container).scrollHeight;
      return el;
    }

    function fillTranslated(el, data, original) {
      el.classList.remove("pending");
      el.textContent = data.translation;
      const details = document.createElement("details");
      const summary = document.createElement("summary");
      summary.textContent = `Original (${data.sourceLanguage ?? "sin texto"})`;
      details.append(summary, document.createTextNode(original));
      const info = document.createElement("span");
      info.className = "info";
      info.textContent = `Traducido en ${data.ms} ms`;
      el.append(details, info);
    }

    async function translate(text, target) {
      const res = await fetch("/api/translate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text, target }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Error al traducir");
      return data;
    }

    async function send({ text, fromBox, toBox, target, onDone }) {
      addBubble(fromBox, "out", text);
      const pending = addBubble(toBox, "in pending", "Traduciendo…");
      try {
        const data = await translate(text, target);
        fillTranslated(pending, data, text);
        onDone?.(data);
      } catch (err) {
        pending.classList.remove("pending");
        pending.classList.add("error");
        pending.textContent = `⚠ ${err.message}`;
      }
    }

    function bindForm(formId, inputId, handler) {
      const input = $(inputId);
      $(formId).addEventListener("submit", (e) => {
        e.preventDefault();
        const text = input.value.trim();
        if (!text) return;
        input.value = "";
        handler(text);
      });
      // Enter envía, Shift+Enter hace salto de línea
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          $(formId).requestSubmit();
        }
      });
    }

    const sendAsClient = (text) =>
      send({
        text,
        fromBox: "client-messages",
        toBox: "owner-messages",
        target: state.ownerLanguage,
        onDone: (data) => {
          if (data.sourceLanguage && data.sourceLanguage !== state.ownerLanguage) {
            state.detectedClientLanguage = data.sourceLanguage;
          }
          $("status").textContent = `Idioma detectado: ${state.detectedClientLanguage ?? "—"}`;
        },
      });

    const sendAsOwner = (text) =>
      send({ text, fromBox: "owner-messages", toBox: "client-messages", target: clientLanguage() });

    bindForm("client-form", "client-input", sendAsClient);
    bindForm("owner-form", "owner-input", sendAsOwner);

    function resetChats() {
      $("client-messages").replaceChildren();
      $("owner-messages").replaceChildren();
      state.detectedClientLanguage = null;
      $("status").textContent = "Idioma detectado: —";
    }
    $("reset").addEventListener("click", resetChats);

    // Escenarios de prueba: se reproducen turno a turno con traducción real.
    let scenarios = [];
    fetch("/api/scenarios")
      .then((r) => r.json())
      .then((list) => {
        scenarios = list;
        list.forEach((s, i) => $("scenario").add(new Option(s.name, String(i))));
      });

    const pause = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

    $("play").addEventListener("click", async () => {
      const scenario = scenarios[Number($("scenario").value)];
      if (!scenario) return;
      $("play").disabled = true;
      resetChats();
      for (const turn of scenario.turns) {
        await (turn.from === "cliente" ? sendAsClient(turn.text) : sendAsOwner(turn.text));
        await pause(600);
      }
      $("play").disabled = false;
    });
  </script>
</body>
</html>
